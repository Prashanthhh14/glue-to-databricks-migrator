name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[spark,dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test (unit + Spark end-to-end)
        run: pytest -q

      - name: Converted examples are up to date
        run: |
          glue2dbx convert examples/glue_jobs --out examples/converted
          git diff --exit-code examples/converted
